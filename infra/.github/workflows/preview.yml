name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.0'
  PNPM_VERSION: '9.15.4'

jobs:
  deploy-preview:
    name: Deploy preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.maison14-preview.fr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Vercel CLI
        run: pnpm install -g vercel@latest
      - name: Create Neon DB branch for preview
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo 'NEON_API_KEY not set, skipping DB branch'
            exit 0
          fi
          RESPONSE=$(curl -fsS -X POST \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"branch":{"name":"preview-pr-'${{ github.event.pull_request.number }}'","parent_id":"main"}}')
          echo "$RESPONSE" | jq .
      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy preview
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --archive=tgz --yes)
          echo "deployment-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "preview-url=https://pr-${{ github.event.pull_request.number }}.maison14-preview.fr" >> "$GITHUB_OUTPUT"
      - name: Set alias
        run: |
          vercel alias set "${{ steps.deploy.outputs.deployment-url }}" \
            "pr-${{ github.event.pull_request.number }}.maison14-preview.fr" \
            --token=${{ secrets.VERCEL_TOKEN }}
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-url
          message: |
            ✅ Preview deployed!
            - 🌐 **Web**: https://pr-${{ github.event.pull_request.number }}.maison14-preview.fr
            - 🔌 **API**: https://api-pr-${{ github.event.pull_request.number }}.maison14-preview.fr
            - 🗄️ **DB branch**: `preview-pr-${{ github.event.pull_request.number }}`
            - 📦 Commit: `${{ github.event.pull_request.head.sha }}`

  cleanup:
    name: Cleanup preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete preview deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel rm "pr-${{ github.event.pull_request.number }}.maison14-preview.fr" \
            --token=$VERCEL_TOKEN --yes || echo 'no preview to remove'
      - name: Delete Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            exit 0
          fi
          BRANCH_ID=$(curl -fsS \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" | \
            jq -r '.branches[] | select(.name=="preview-pr-${{ github.event.pull_request.number }}") | .id')
          if [ -n "$BRANCH_ID" ]; then
            curl -fsS -X DELETE \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
              -H "Authorization: Bearer $NEON_API_KEY" || true
          fi